name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux-gcc:
    name: Linux (GCC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install --yes gcc meson ninja-build
      - name: Configure
        run: meson setup build --werror
      - name: Build
        run: meson compile -C build
      - name: Test
        run: meson test -C build --print-errorlogs

  windows-mingw:
    name: Windows (MinGW-w64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja
      - name: Configure
        run: meson setup build --werror
      - name: Build
        run: meson compile -C build
      - name: Test
        run: meson test -C build --print-errorlogs

  linux-sanitizers:
    name: Linux (ASan + UBSan)
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      PORPOISE_TEST_MESON_ARGS: -Db_sanitize=address,undefined
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install --yes gcc meson ninja-build
      - name: Configure
        run: meson setup build --werror -Db_sanitize=address,undefined
      - name: Build
        run: meson compile -C build
      - name: Test
        run: meson test -C build --print-errorlogs

  cppcheck:
    name: Cppcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Cppcheck
        run: sudo apt-get update && sudo apt-get install --yes cppcheck
      - name: Analyze
        run: >-
          cppcheck
          --enable=warning,style,performance,portability
          --error-exitcode=1
          --suppress=missingIncludeSystem
          --std=c11
          -Iinclude
          -Iruntime/include
          -Ithird_party/jsmn
          src include runtime/src runtime/include

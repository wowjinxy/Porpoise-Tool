name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux-gcc:
    name: Linux (GCC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install --yes gcc meson ninja-build
      - name: Configure
        run: meson setup build --werror
      - name: Build
        run: meson compile -C build
      - name: Test
        run: meson test -C build --print-errorlogs

  windows-mingw:
    name: Windows (MinGW-w64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja
      - name: Configure
        run: meson setup build --werror
      - name: Build
        run: meson compile -C build
      - name: Test
        run: meson test -C build --print-errorlogs

  linux-gui-release:
    name: Linux GUI (Release, bundled dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools and desktop headers
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          build-essential
          cmake
          git
          libasound2-dev
          libdbus-1-dev
          libdrm-dev
          libegl1-mesa-dev
          libgbm-dev
          libgl1-mesa-dev
          libibus-1.0-dev
          libpulse-dev
          libudev-dev
          libwayland-dev
          libx11-dev
          libxcursor-dev
          libxext-dev
          libxi-dev
          libxinerama-dev
          libxkbcommon-dev
          libxrandr-dev
          libxss-dev
          libxtst-dev
          meson
          ninja-build
          wayland-protocols
          xorg-dev
      - name: Configure bundled GUI release
        run: meson setup build-gui --buildtype=release --werror -Dgui=enabled
      - name: Build
        run: meson compile -C build-gui
      - name: Run headless GUI smoke tests
        run: >-
          meson test -C build-gui
          workbench-model workbench-gui-startup --print-errorlogs
      - name: Stage release bundle
        run: meson install -C build-gui --destdir "$RUNNER_TEMP/porpoise-gui-linux"
      - uses: actions/upload-artifact@v4
        with:
          name: porpoise-gui-linux
          path: ${{ runner.temp }}/porpoise-gui-linux

  windows-gui-release:
    name: Windows GUI (Release, bundled dependencies)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja
      - name: Configure bundled GUI release
        run: meson setup build-gui --buildtype=release --werror -Dgui=enabled
      - name: Build
        run: meson compile -C build-gui
      - name: Run headless GUI smoke tests
        run: >-
          meson test -C build-gui
          workbench-model workbench-gui-startup --print-errorlogs
      - name: Stage release bundle
        run: meson install -C build-gui --destdir "$RUNNER_TEMP/porpoise-gui-windows"
      - name: Bundle MinGW C++ runtime
        run: |
          gui_exe="$(find "$RUNNER_TEMP/porpoise-gui-windows" -type f -name porpoise-gui.exe -print -quit)"
          test -n "$gui_exe"
          gui_bin="$(dirname "$gui_exe")"
          compiler_bin="$(dirname "$(command -v g++)")"
          for runtime in libgcc_s_seh-1.dll libstdc++-6.dll libwinpthread-1.dll; do
            runtime_path="$compiler_bin/$runtime"
            test -f "$runtime_path"
            cp "$runtime_path" "$gui_bin/"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: porpoise-gui-windows
          path: ${{ runner.temp }}/porpoise-gui-windows

  linux-sanitizers:
    name: Linux (ASan + UBSan)
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      PORPOISE_TEST_MESON_ARGS: -Db_sanitize=address,undefined
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install --yes gcc meson ninja-build
      - name: Configure
        run: meson setup build --werror -Db_sanitize=address,undefined
      - name: Build
        run: meson compile -C build
      - name: Test
        run: meson test -C build --print-errorlogs

  cppcheck:
    name: Cppcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Cppcheck
        run: sudo apt-get update && sudo apt-get install --yes cppcheck
      - name: Analyze
        run: >-
          cppcheck
          --enable=warning,performance,portability
          --error-exitcode=1
          --inline-suppr
          --suppress=missingIncludeSystem
          --suppress=preprocessorErrorDirective:runtime/src/porpoise_libporpoise_guest_os.c:6
          --std=c11
          -Iinclude
          -Iruntime/include
          -Ithird_party/jsmn
          src include runtime/src runtime/include
